name: release

on:
  push:
    branches: ["main"]

jobs:
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Bump package versions
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e "
          const fs = require('fs');
          const version = `0.1.${process.env.RUN_NUMBER}`;
          const files = [
            'package.json',
            'packages/server/package.json',
            'packages/web/package.json'
          ];
          for (const file of files) {
            const data = JSON.parse(fs.readFileSync(file, 'utf8'));
            data.version = version;
            fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          }
          const lockPath = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.version = version;
          if (lock.packages && lock.packages['']) {
            lock.packages[''].version = version;
          }
          if (lock.packages && lock.packages['packages/server']) {
            lock.packages['packages/server'].version = version;
          }
          if (lock.packages && lock.packages['packages/web']) {
            lock.packages['packages/web'].version = version;
          }
          fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');
          "
      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json packages/server/package.json packages/web/package.json
          git commit -m "chore: bump version to 0.1.${{ github.run_number }} [skip ci]"
          git push
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        if: ${{ secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            lazystrap/lazystrap:latest
            lazystrap/lazystrap:1.0.${{ github.run_number }}
