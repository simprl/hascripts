name: lazystrap

services:
  lazystrap-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    volumes:
      - .:/app
      - lazystrap_node_modules:/app/node_modules
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8322:8322"
      - "8323:8323"
    environment:
      NODE_ENV: development
      PORT: 8322
      WEB_DEV_SERVER_URL: http://127.0.0.1:8323
    tty: true

volumes:
  lazystrap_node_modules:
